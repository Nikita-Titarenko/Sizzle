map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Resolve the API container through Docker DNS at request time, so a restarted
    # (re-addressed) API container does not leave nginx pointing at a stale IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://sizzle-webapi:8080;

    root /usr/share/nginx/html;
    index index.html;

    # Recipe step videos can be up to 100 MB.
    client_max_body_size 110m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Same routes the dev server proxies (proxy.conf.json). The original Host is kept so the API
    # builds /uploads URLs on this origin and the Google state cookie stays on localhost:4200.
    location ~ ^/(api|uploads)/ {
        proxy_pass $api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hubs/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_read_timeout 1h;
    }

    # Angular build output has a content hash in the name (main-AB12CD34.js), so it never changes.
    location ~* "-[A-Za-z0-9_-]{8}\.(?:js|css)$" {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # nginx's MIME table has no entry for web app manifests.
    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
    }

    # Icons and logo keep fixed names, so browsers must pick up a new version.
    location ~* \.(?:ico|png|svg)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
    }

    # Everything else is an Angular route.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
