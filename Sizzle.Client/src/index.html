<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sizzle</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Recipes from the community" />
    <meta name="theme-color" content="#0b0b0d" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <script>
      // Apply the saved theme before the first paint, so the light theme does not flash dark.
      if (localStorage.getItem('sizzle.theme') === 'light') {
        document.documentElement.dataset.theme = 'light';
        document.querySelector('meta[name="theme-color"]').content = '#fffaf5';
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
