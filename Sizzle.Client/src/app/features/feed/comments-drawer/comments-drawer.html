<div class="backdrop" (click)="closed.emit()"></div>
<aside
  class="drawer"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="'feed.comments.title' | t: { recipe: recipe().name }"
>
  <header class="drawer-header">
    <b>{{ recipe().name }}</b>
    <button
      type="button"
      class="close"
      [attr.aria-label]="'feed.comments.close' | t"
      (click)="closed.emit()"
    >
      <app-icon name="close" />
    </button>
  </header>
  <div class="drawer-body">
    <app-comment-section [recipeId]="recipe().id" />
  </div>
</aside>
