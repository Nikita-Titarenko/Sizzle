<div class="card auth-box">
  <h2>{{ 'auth.register.title' | t }}</h2>
  <form class="form" (ngSubmit)="submit()">
    <label>
      <span>{{ 'auth.name' | t }}</span>
      <input name="name" [(ngModel)]="name" required />
    </label>
    <label>
      <span>{{ 'auth.email' | t }}</span>
      <input type="email" name="email" [(ngModel)]="email" required />
    </label>
    <label>
      <span>{{ 'auth.password' | t }}</span>
      <input type="password" name="password" [(ngModel)]="password" required />
    </label>
    @if (error()) {
      <div class="error">{{ error() }}</div>
    }
    <button class="btn" [disabled]="busy()">{{ 'auth.register.submit' | t }}</button>
  </form>
  <div class="divider">{{ 'auth.or' | t }}</div>
  <a class="btn google block" [href]="googleLoginUrl">{{ 'auth.continueWithGoogle' | t }}</a>
  <p class="muted">
    {{ 'auth.register.haveAccount' | t }}
    <a routerLink="/login">{{ 'auth.register.logIn' | t }}</a>
  </p>
</div>
