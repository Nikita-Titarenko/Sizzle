<app-auth-layout>
  <h1 class="auth-title">{{ 'auth.login.title' | t }}</h1>
  <app-google-button [href]="googleLoginUrl" />
  <div class="divider">{{ 'auth.or' | t }}</div>
  <form class="form" (ngSubmit)="submit()">
    <label>
      <span>{{ 'auth.email' | t }}</span>
      <input type="email" name="email" autocomplete="email" [(ngModel)]="email" required />
    </label>
    <label>
      <span>{{ 'auth.password' | t }}</span>
      <input
        type="password"
        name="password"
        autocomplete="current-password"
        [(ngModel)]="password"
        required
      />
    </label>
    @if (error()) {
      <div class="alert" role="alert">{{ error() }}</div>
    }
    <button class="btn block large" [disabled]="busy()">{{ 'auth.login.submit' | t }}</button>
  </form>
  <p class="auth-switch">
    {{ 'auth.login.noAccount' | t }}
    <a routerLink="/register">{{ 'auth.login.signUp' | t }}</a>
  </p>
</app-auth-layout>
