<div class="backdrop"></div>
<div
  #dialog
  class="ad"
  role="dialog"
  aria-modal="true"
  aria-labelledby="ad-title"
  tabindex="-1"
  (keydown)="trapFocus($event)"
>
  <div class="bar">
    <span class="label">{{ 'ads.label' | t }}</span>
    <span class="spacer"></span>
    @if (done()) {
      <button
        type="button"
        class="close"
        [attr.aria-label]="'ads.close' | t"
        [title]="'ads.close' | t"
        (click)="close()"
      >
        <app-icon name="close" />
      </button>
    } @else {
      <span
        class="countdown"
        role="timer"
        [attr.aria-label]="'ads.closeIn' | t: { count: secondsLeft() }"
      >
        <svg viewBox="0 0 36 36" aria-hidden="true">
          <circle class="track" cx="18" cy="18" r="15.9155" pathLength="100" />
          <circle
            class="progress"
            cx="18"
            cy="18"
            r="15.9155"
            pathLength="100"
            [attr.stroke-dashoffset]="100 - ring()"
          />
        </svg>
        <span>{{ secondsLeft() }}</span>
      </span>
    }
  </div>

  <div class="creative" [attr.data-kind]="creative.kind">
    <span class="art"><app-icon [name]="creative.icon" /></span>
    <h2 id="ad-title">{{ creative.title | t }}</h2>
    <p>{{ creative.text | t }}</p>
    <button type="button" class="btn large" (click)="follow()">
      {{ creative.cta | t }}
    </button>
  </div>

  <p class="foot muted">
    @if (done()) {
      {{ 'ads.thanks' | t }}
    } @else {
      {{ 'ads.closeIn' | t: { count: secondsLeft() } }}
    }
  </p>
</div>
