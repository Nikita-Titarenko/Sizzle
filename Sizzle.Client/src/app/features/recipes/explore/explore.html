<section class="hero">
  <h1>Explore recipes</h1>
  <input
    class="search"
    type="search"
    placeholder="Search recipes…"
    [ngModel]="search()"
    (ngModelChange)="onSearch($event)"
  />
</section>

<div class="ingredient-filter">
  <app-ingredient-picker
    placeholder="Filter by ingredient…"
    [excludeIds]="ingredientIds()"
    (picked)="addIngredient($event)"
  />
  @if (ingredients().length) {
    <div class="row selected">
      @for (ingredient of ingredients(); track ingredient.id) {
        <span class="removable-chip">
          @if (ingredient.parentName) {
            <span class="chip-context">{{ ingredient.parentName }} ›</span>
          }
          {{ ingredient.name }}
          <button
            type="button"
            [attr.aria-label]="'Remove ' + ingredient.name"
            (click)="removeIngredient(ingredient.id)"
          >
            <app-icon name="close" />
          </button>
        </span>
      }
    </div>
  }
</div>

<div class="row chips">
  @for (category of categories(); track category.id) {
    <button
      class="chip"
      [class.on]="selected().has(category.id)"
      (click)="toggleCategory(category.id)"
    >
      {{ category.name }}
    </button>
  }
</div>

@if (page(); as page) {
  <app-recipe-grid [recipes]="page.data" emptyText="Nothing found. Try another search." />
  <app-pager
    [pageIndex]="pageIndex()"
    [pageSize]="pageSize"
    [total]="page.totalSize"
    (change)="goTo($event)"
  />
} @else {
  <p class="muted">Loading…</p>
}
