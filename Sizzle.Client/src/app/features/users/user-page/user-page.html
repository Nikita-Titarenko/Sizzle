@if (error() && !user()) {
  <app-status-view [heading]="'errors.title' | t" [message]="error()" />
} @else if (error()) {
  <p class="alert" role="alert">{{ error() }}</p>
}
@if (user(); as u) {
  <section class="card row header">
    <app-user-avatar [name]="u.name" [imageUrl]="u.imageUrl" size="large" />
    <div>
      <h1>{{ u.name }}</h1>
    </div>
    <span class="spacer"></span>
    @if (auth.isLoggedIn() && !isMe()) {
      <button class="btn" [class.outline]="followed()" (click)="toggleFollow()">
        {{ (followed() ? 'user.unfollow' : 'common.follow') | t }}
      </button>
    }
  </section>

  <h2>{{ 'user.recipes' | t }}</h2>
  @if (page(); as page) {
    <app-recipe-grid [recipes]="page.data" />
    <app-pager
      [pageIndex]="pageIndex()"
      [pageSize]="pageSize"
      [total]="page.totalSize"
      (change)="pageIndex.set($event)"
    />
  } @else {
    <app-loader />
  }
} @else if (!error()) {
  <app-loader />
}
