<header class="topbar">
  <a routerLink="/" class="brand" aria-label="Sizzle">
    <img class="brand-mark" src="logo-mark.png" alt="" width="36" height="36" />
    <span class="brand-name">Sizzle</span>
  </a>
  <nav class="nav">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      {{ 'nav.forYou' | t }}
    </a>
    <a routerLink="/explore" routerLinkActive="active">{{ 'nav.explore' | t }}</a>
    @if (auth.isLoggedIn()) {
      <a routerLink="/recipes/new" routerLinkActive="active">{{ 'nav.newRecipe' | t }}</a>
      <a routerLink="/profile" routerLinkActive="active">{{ 'nav.profile' | t }}</a>
      <button class="link" (click)="logout()">{{ 'nav.logOut' | t }}</button>
    } @else {
      <a routerLink="/login" routerLinkActive="active">{{ 'nav.logIn' | t }}</a>
      <a routerLink="/register" class="btn small">{{ 'nav.signUp' | t }}</a>
    }
    <button
      type="button"
      class="theme-toggle"
      [attr.aria-label]="(theme.current() === 'dark' ? 'nav.lightTheme' : 'nav.darkTheme') | t"
      [attr.title]="(theme.current() === 'dark' ? 'nav.lightTheme' : 'nav.darkTheme') | t"
      (click)="theme.toggle()"
    >
      <app-icon [name]="theme.current() === 'dark' ? 'sun' : 'moon'" />
    </button>
    <app-language-menu />
  </nav>
</header>
