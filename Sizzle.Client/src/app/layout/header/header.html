<header class="topbar">
  <a routerLink="/" class="brand">🔥 Sizzle</a>
  <nav class="nav">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      For you
    </a>
    <a routerLink="/explore" routerLinkActive="active">Explore</a>
    @if (auth.isLoggedIn()) {
      <a routerLink="/recipes/new" routerLinkActive="active">New recipe</a>
      <a routerLink="/profile" routerLinkActive="active">Profile</a>
      <button class="link" (click)="logout()">Log out</button>
    } @else {
      <a routerLink="/login" routerLinkActive="active">Log in</a>
      <a routerLink="/register" class="btn small">Sign up</a>
    }
    <select class="language" aria-label="Content language" (change)="changeLanguage($event)">
      @for (option of languages; track option.code) {
        <option [value]="option.code" [selected]="option.code === language.current()">
          {{ option.code.toUpperCase() }} · {{ option.label }}
        </option>
      }
    </select>
  </nav>
</header>
