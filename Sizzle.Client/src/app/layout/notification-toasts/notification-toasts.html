@if (notifications.items().length) {
  <aside class="toasts">
    @for (item of notifications.items(); track item.recipeId) {
      <div class="toast">
        <a
          [routerLink]="['/recipes', item.recipeId]"
          (click)="notifications.dismiss(item.recipeId)"
        >
          <b>{{ item.authorName }}</b>
          {{ 'notifications.posted' | t: { recipe: item.recipeName } }}
        </a>
        <button
          class="link"
          [attr.aria-label]="'notifications.dismiss' | t"
          (click)="notifications.dismiss(item.recipeId)"
        >
          <app-icon name="close" />
        </button>
      </div>
    }
  </aside>
}
