<div class="picker" [class.open]="open()">
  <input
    type="search"
    autocomplete="off"
    [placeholder]="placeholder() || ('ingredients.search' | t)"
    [ngModel]="term()"
    [ngModelOptions]="{ standalone: true }"
    (ngModelChange)="onTermChange($event)"
    (focus)="onFocus()"
    (keydown)="onKeydown($event)"
  />

  @if (open()) {
    <ul class="dropdown" role="listbox">
      @for (row of rows(); track row.choice.id) {
        <li role="option" [attr.aria-disabled]="row.disabled">
          <button
            type="button"
            class="option"
            [class.child]="row.depth > 0"
            [class.parent]="row.hasChildren"
            [disabled]="row.disabled"
            (click)="pick(row)"
          >
            @if (row.depth > 0) {
              <app-icon class="branch" name="corner-down-right" />
            }
            <span class="name">{{ row.choice.name }}</span>
            @if (row.hasChildren) {
              <span class="kind">{{ 'ingredients.group' | t }}</span>
            }
            <span class="spacer"></span>
            @if (row.disabled) {
              <span class="added">
                <app-icon name="check" />
                {{ 'ingredients.added' | t }}
              </span>
            } @else {
              <span class="muted unit">{{ row.choice.unit | unitLabel }}</span>
            }
          </button>
        </li>
      } @empty {
        <li class="empty muted">
          {{ (loading() ? 'ingredients.searching' : 'ingredients.none') | t }}
        </li>
      }
    </ul>
  }
</div>
