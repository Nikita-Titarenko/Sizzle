<input
  #fileInput
  type="file"
  hidden
  [accept]="accept()"
  [multiple]="multiple()"
  (change)="onSelected($event)"
/>

@if (previews().length || currentUrl()) {
  <div
    class="previews"
    [class.single]="!multiple()"
    [class.dragging]="dragging()"
    (dragover)="onDragOver($event)"
    (dragleave)="dragging.set(false)"
    (drop)="onDrop($event)"
  >
    @for (preview of previews(); track preview.url) {
      <figure class="thumb">
        @if (preview.isVideo) {
          <video [src]="preview.url" muted playsinline preload="metadata"></video>
          <span class="badge"><app-icon name="play" filled /></span>
        } @else {
          <img [src]="preview.url" [alt]="preview.file.name" />
        }
        <button
          type="button"
          class="remove"
          [attr.aria-label]="'Remove ' + preview.file.name"
          (click)="remove(preview.file)"
        >
          <app-icon name="close" />
        </button>
        <figcaption>{{ preview.file.name }}</figcaption>
      </figure>
    } @empty {
      <figure class="thumb current">
        @if (currentIsVideo()) {
          <video [src]="currentUrl()" muted playsinline preload="metadata"></video>
        } @else {
          <img [src]="currentUrl()" alt="Current media" />
        }
        <figcaption>Current</figcaption>
      </figure>
    }

    <button type="button" class="thumb add" (click)="browse()">
      <app-icon [name]="multiple() ? 'plus' : 'upload'" />
      <span>{{ multiple() ? 'Add more' : 'Replace' }}</span>
    </button>
  </div>
} @else {
  <button
    type="button"
    class="dropzone"
    [class.dragging]="dragging()"
    (click)="browse()"
    (dragover)="onDragOver($event)"
    (dragleave)="dragging.set(false)"
    (drop)="onDrop($event)"
  >
    <span class="dropzone-icon"><app-icon name="image" /></span>
    <span class="dropzone-title">
      <b>Click to upload</b>
      or drag and drop
    </span>
    <span class="muted">
      {{
        hint() ||
          (allowVideo()
            ? 'JPG, PNG, WEBP, GIF up to 5 MB · MP4, WEBM, MOV up to 100 MB'
            : 'JPG, PNG, WEBP, GIF up to 5 MB')
      }}
    </span>
  </button>
}

@if (error()) {
  <p class="error">{{ error() }}</p>
}
