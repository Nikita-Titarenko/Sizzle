<div class="comment">
  <div class="row head">
    <app-user-avatar [name]="comment().userName" [imageUrl]="comment().userImageUrl" />
    <a [routerLink]="['/users', comment().userId]">
      <b>{{ comment().userName }}</b>
    </a>
    <span class="muted">{{ comment().createdAt | date: 'short' }}</span>
  </div>

  @if (mode() === 'edit') {
    <form class="form" (ngSubmit)="submitEdit()">
      <textarea name="edit" [(ngModel)]="editText" maxlength="2000"></textarea>
      <div class="row">
        <button class="btn small" [disabled]="!editText.trim()">{{ 'common.save' | t }}</button>
        <button type="button" class="link" (click)="mode.set('view')">
          {{ 'common.cancel' | t }}
        </button>
      </div>
    </form>
  } @else {
    <p class="content">{{ comment().content }}</p>
  }

  <div class="row actions">
    @if (canReply()) {
      <button class="link" (click)="toggleReply()">{{ 'common.reply' | t }}</button>
    }
    @if (canModify()) {
      <button class="link" (click)="startEdit()">{{ 'common.edit' | t }}</button>
      <button class="link" (click)="deleted.emit()">{{ 'common.delete' | t }}</button>
    }
  </div>

  @if (mode() === 'reply') {
    <form class="form reply" (ngSubmit)="submitReply()">
      <textarea
        name="reply"
        [(ngModel)]="replyText"
        [placeholder]="'comments.replyPlaceholder' | t"
        maxlength="2000"
      ></textarea>
      <div>
        <button class="btn small" [disabled]="!replyText.trim()">{{ 'common.reply' | t }}</button>
      </div>
    </form>
  }
</div>
