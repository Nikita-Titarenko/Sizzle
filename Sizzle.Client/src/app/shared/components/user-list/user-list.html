<ul class="users">
  @for (u of users(); track u.id) {
    <li>
      <a class="row" [routerLink]="['/users', u.id]">
        @if (u.imageUrl) {
          <img class="avatar" [src]="u.imageUrl" alt="" />
        } @else {
          <span class="avatar">{{ u.name.charAt(0) }}</span>
        }
        {{ u.name }}
      </a>
    </li>
  } @empty {
    <li class="muted">{{ emptyText() }}</li>
  }
</ul>
