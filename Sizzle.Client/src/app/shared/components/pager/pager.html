@if (pages() > 1) {
  <div class="row pager">
    <button
      class="btn small outline"
      [disabled]="pageIndex() === 0"
      (click)="change.emit(pageIndex() - 1)"
    >
      ←
    </button>
    <span class="muted">Page {{ pageIndex() + 1 }} of {{ pages() }}</span>
    <button
      class="btn small outline"
      [disabled]="pageIndex() + 1 >= pages()"
      (click)="change.emit(pageIndex() + 1)"
    >
      →
    </button>
  </div>
}
