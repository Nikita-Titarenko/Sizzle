org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# API the app talks to. 10.0.2.2 is the host machine as seen from the Android emulator;
# for a physical phone use your computer's LAN address (e.g. http://192.168.1.20:8080/).
# Override per machine in ~/.gradle/gradle.properties or with -Psizzle.apiUrl=...
sizzle.apiUrl=http://10.0.2.2:8080/
# Website address used in shared recipe links.
sizzle.webUrl=http://localhost:4200/
# Google OAuth *web* client ID (the same GoogleOAuth:ClientId the API uses). Empty hides Google sign-in.
sizzle.googleWebClientId=132522085272-hnc09j99arvsjhn79vpjf9sd204hihhp.apps.googleusercontent.com
